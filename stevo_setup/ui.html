<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEVO Einrichtung</title>
<style>
:root{--fg:#1b1b18;--mu:#6d6c66;--li:#e6e4dd;--bg:#faf9f6;--sf:#fff;--ac:#4f6b57;--ok:#3d7a4f;--warn:#b07a1f;--bad:#b2453a}
@media(prefers-color-scheme:dark){:root{--fg:#efeee9;--mu:#a3a29b;--li:#34332f;--bg:#161614;--sf:#1f1f1c}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:640px;margin:0 auto;padding:32px 20px 60px}
.kick{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px;letter-spacing:-.01em}p{margin:0 0 10px;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--li);border-radius:14px;padding:22px;margin-top:20px}
.code{font:700 52px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;margin:6px 0 10px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}li{display:flex;gap:10px}li::before{content:"○";width:16px;flex:none;color:var(--mu)}
li.ok::before{content:"✓";color:var(--ok)}li.run::before{content:"●";color:var(--warn);animation:p 1.2s infinite}li.err::before{content:"✕";color:var(--bad)}li.skip{opacity:.55}li.skip::before{content:"–"}
li b{display:block;font-weight:600}li small{color:var(--mu)}
@keyframes p{50%{opacity:.3}}
pre{margin:0;padding:12px;border-radius:10px;background:var(--bg);font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:260px;overflow:auto;color:var(--mu)}
details{margin-top:20px}summary{cursor:pointer;color:var(--mu);font-size:13px}
button{font:inherit;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--li);background:var(--sf);color:var(--fg);cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.err{color:var(--bad)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.off{background:var(--bad)}
</style></head><body><main id="m"><div class="kick">STEVO Einrichtung</div><h1>Einen Moment …</h1></main>
<script>
var m=document.getElementById("m"),last="";
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function post(p){return fetch(p,{method:"POST"}).then(tick)}
function draw(s){
  var h='<div class="kick">STEVO Einrichtung</div>';
  if(s.phase==="start"||(s.phase==="code"&&!s.code)) h+='<h1>Hole einen Code …</h1><p>Der Pi meldet sich bei __SITE__.</p>';
  else if(s.phase==="code") h+='<h1>Code im Team-Panel eingeben.</h1><p>Team-Panel → <b>Neuer Pi</b> → Code eintragen und Kunden wählen. Den Rest macht der Pi selbst.</p><div class="card"><div class="kick"><span class="dot'+(s.online?"":" off")+'"></span>Dein Code</div><div class="code">'+e(s.code)+'</div><p>Gilt 6 Stunden. Diese Seite aktualisiert sich von selbst.</p></div>';
  else {
    h+='<h1>'+(s.phase==="fertig"?"Fertig.":s.phase==="fehler"?"Da hat etwas nicht geklappt.":"Richte den Pi ein …")+'</h1><p>'+(s.customer?"Für "+e(s.customer)+". ":"")+(s.phase==="fertig"?(s.remote?'Erreichbar unter <a href="'+e(s.remote)+'" target="_blank" rel="noopener">'+e(s.remote.replace("https://",""))+'</a>.':"Alles erledigt."):s.phase==="fehler"?'<span class="err">'+e(s.error)+'</span>':"Das dauert meist 10 bis 20 Minuten. Du kannst die Seite schließen.")+'</p>';
    h+='<div class="card"><ol>'+s.steps.map(function(x){return '<li class="'+e(x.st)+'"><span><b>'+e(x.n)+'</b>'+(x.x?'<small>'+e(x.x)+'</small>':'')+'</span></li>'}).join("")+'</ol></div>';
    if(s.phase==="fehler") h+='<p style="margin-top:16px"><button class="p" onclick="post(\'retry\')">Nochmal versuchen</button> <button onclick="post(\'neu\')">Neuen Code holen</button></p>';
  }
  if(s.log&&s.log.length) h+='<details'+(s.phase==="fehler"?" open":"")+'><summary>Protokoll</summary><pre>'+e(s.log.join("\n"))+'</pre></details>';
  if(h!==last){var op=m.querySelector("details")&&m.querySelector("details").open;m.innerHTML=h;last=h;if(op&&m.querySelector("details"))m.querySelector("details").open=true}
}
function tick(){return fetch("state",{cache:"no-store"}).then(function(r){return r.json()}).then(draw).catch(function(){})}
tick();setInterval(tick,2000);
</script></body></html>
